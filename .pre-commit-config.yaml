# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: "^3rdparty/.*"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [ "--fix=lf" ]
      - id: check-case-conflict
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.1
    hooks:
      # Ensure uv.lock stays in sync automatically.
      - id: uv-lock
      # requirements.txt only tracks the "test" group (no lint/type-check
      # tools) so the Jenkins python-baseline (python:3.8.0) container can
      # still install it to run the test suite.
      - id: uv-export
        args: [ "--format", "requirements-txt", "--no-hashes", "--only-group", "test", "-o", "requirements.txt" ]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [ python, pyi ]
        stages: [ pre-push, pre-commit, manual ]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [ python, pyi ]
        stages: [ pre-push, pre-commit, manual ]
      - id: flake8
        name: flake8
        entry: uv run --frozen flake8
        language: system
        types: [ python ]
      - id: pyrefly
        name: Pyrefly (type checking)
        entry: uv run --frozen pyrefly check
        language: system
        pass_filenames: false
        types: [ python ]
      - id: ty
        name: ty (type checking)
        entry: uv run --frozen ty check
        language: system
        pass_filenames: false
        types: [ python ]
      - id: cheribuild-commit-messages
        name: cheribuild commit message check
        entry: githooks/pre-push.sh
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [ pre-push ]
      - id: cheribuild-pytest
        name: cheribuild pytest
        entry: sh -c 'python3 -m pytest -q . >&2'
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [ pre-push, manual ]
      - id: cheribuild-smoke-test
        name: cheribuild smoke test
        entry: tests/run_smoke_tests.sh
        language: system
        always_run: true
        pass_filenames: false
        verbose: true
        stages: [ pre-push, manual ]
