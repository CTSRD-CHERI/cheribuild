# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-docker:
        strategy:
            matrix:
              image: [ 'python:3.10', 'python:3.12', 'python:latest', 'ubuntu:22.04', 'ubuntu:latest' ]
        runs-on: ubuntu-latest
        container:
          image: ${{ matrix.image }}
        steps:
            -   uses: actions/checkout@v7
            -   name: Install Python
                if: startsWith(matrix.image, 'ubuntu:')
                run: apt-get update && apt-get install -y python3 python3-pip
            -   name: Install dependencies
                run: |
                    # Run as a non-root user to avoid cheribuild errors
                    adduser --disabled-password --gecos "Not Root" notroot
                    su -c "python3 -m pip install --user --upgrade pip pytest pytest-xdist" notroot
            -   name: Run basic regression tests
                run: su -c "tests/run_basic_tests.sh" notroot
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ macos-latest, ubuntu-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v7
            -   name: Install uv
                uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
                with:
                    enable-cache: true
            -   name: Install dependencies
                # uv manages its own Python if the runner's system python doesn't
                # satisfy pyproject.toml, so no actions/setup-python step is needed.
                run: uv sync --locked --group dev
            -   name: Lint with flake8
                run: uv run --frozen flake8
            -   name: Lint with ruff
                run: uv run --frozen ruff check .
            -   name: Type check with pyrefly
                run: uv run --frozen pyrefly check
            -   name: Type check with ty
                run: uv run --frozen ty check
            -   name: Run pre-commit checks
                run: uv run --frozen pre-commit run --all-files
            -   name: Run basic regression tests
                run: uv run --frozen tests/run_basic_tests.sh
    typecheck:
        strategy:
            matrix:
                # Python versions > 3.13 are not yet supported and 3.12 appears to be buggy for now.
                # TODO: stop using pytype since it is EOL.
                version: [ 3.11 ]
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            # Need at least python 3.8 to allow pytype to parse all the features we make use of
            -   name: Set up Python ${{ matrix.version }}
                uses: actions/setup-python@v5
                with:
                    python-version: ${{ matrix.version }}
                    cache: 'pip'
            -   name: Install uv
                uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
                with:
                    enable-cache: true
            -   name: Install dependencies
                run: |
                    # pytype is EOL and not part of the managed dev toolchain, so it isn't
                    # in pyproject.toml. Install it manually here.
                    uv pip install --python "$(which python)" --upgrade pytype
                    uv pip install --python "$(which python)" -r requirements.txt
            -   name: Run pytype
                run: |
                    pytype --config pytype.cfg --python-version ${{ matrix.version }} -j `nproc`
